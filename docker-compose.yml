services:
  postgres:
    image: postgres:16-alpine
    container_name: sportify_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportify}
      POSTGRES_DB: ${POSTGRES_DB:-sportify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sportify} -d ${POSTGRES_DB:-sportify}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sportify_backend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sportify}:${POSTGRES_PASSWORD:-sportify}@postgres:5432/${POSTGRES_DB:-sportify}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-in-production-access-secret-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-refresh-secret-32chars}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sportify_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
